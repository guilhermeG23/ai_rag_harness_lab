name: ai-rag-harness

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
  QDRANT_URL: http://qdrant:6333
  OLLAMA_URL: http://ollama:11434
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_NAME: ai-harness-api
  APP_SECRET: ${APP_SECRET}
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-gemma3:1b}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma}
  MODEL_CONTEXT_TOKENS: ${MODEL_CONTEXT_TOKENS:-4096}
  DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:-30}
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}

services:
  access-portal:
    build: ./apps/access-portal
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      IDENTITY_ADMIN_USER: ${IDENTITY_ADMIN_USER:-admin}
      IDENTITY_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:-admin}
    ports:
      - "8083:8083"
    networks: [public, internal]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 64m

  identity:
    build: ./apps/identity
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      IDENTITY_ADMIN_USER: ${IDENTITY_ADMIN_USER:-admin}
      IDENTITY_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:-admin}
    ports:
      - "8082:8010"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [public, internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m

  frontend:
    build: ./apps/frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
      identity:
        condition: service_healthy
      access-portal:
        condition: service_healthy
    networks: [public, internal]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      valkey: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      ollama: {condition: service_healthy}
      identity: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 1.5

  worker:
    build: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ai-harness-worker
    volumes:
      - uploads:/data/uploads
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
    mem_limit: 1g
    cpus: 1.0

  maintenance-worker:
    build: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.maintenance"]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: ai-harness-maintenance
    volumes:
      - uploads:/data/uploads
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
    mem_limit: 256m

  service-map:
    build: ./apps/service-map
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      api: {condition: service_healthy}
    networks: [public, internal]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "/etc/valkey/valkey.conf", "--requirepass", "${VALKEY_PASSWORD}"]
    volumes:
      - ./infra/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${VALKEY_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 192m

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "15672:15672"
    networks: [internal, public]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  ollama:
    image: ollama/ollama:0.12.3
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [internal, public]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 3g
    cpus: 2.0

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]
    mem_limit: 384m

  loki:
    image: grafana/loki:3.5.5
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [internal]
    mem_limit: 384m

  promtail:
    image: grafana/promtail:3.5.5
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infra/promtail/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [internal]
    mem_limit: 128m

  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [internal]
    mem_limit: 384m

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [tempo]
    networks: [internal]
    mem_limit: 256m

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki, tempo]
    networks: [internal, public]
    mem_limit: 512m

networks:
  public:
  internal:
    internal: true

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  ollama_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  uploads:
