<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identity Manager</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<main><section id="login" class="card login"><h1>Identity Manager</h1><p>Administração global de grupos e usuários</p><form id="login-form"><input id="username" value="admin" placeholder="Usuário"><input id="password" type="password" placeholder="Senha"><button>Entrar</button></form><div id="error"></div></section>
<section id="panel" class="hidden"><header><div><h1>Identity Manager</h1><small>Grupos são relacionados pelo UID, não pelo nome.</small></div><div><button id="admin-password">Alterar senha</button> <button id="logout">Sair</button></div></header><div class="columns"><div class="card"><h2>Grupos</h2><form id="group-form"><input id="group-name" placeholder="Nome descritivo"><button>Criar</button></form><div id="groups"></div></div><div class="card"><h2>Usuários</h2><form id="user-form"><input id="email" type="email" placeholder="E-mail"><input id="display-name" placeholder="Nome"><input id="user-password" type="password" placeholder="Senha"><select id="group"></select><select id="role"><option value="client">cliente</option><option value="admin">admin</option></select><button>Criar</button></form><div id="users"></div></div></div></section></main><script src="/assets/app.js"></script></body></html>
