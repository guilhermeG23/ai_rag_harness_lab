<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa de serviços</title><style>
body{margin:0;background:#09101a;color:#e5edf7;font:15px system-ui}header{padding:22px 30px;border-bottom:1px solid #253247;display:flex;justify-content:space-between}h1{margin:0;font-size:22px}.wrap{padding:28px}.summary{color:#94a5bb;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.node{background:#121c2a;border:1px solid #2a3a52;border-left:5px solid #718096;border-radius:12px;padding:16px}.node.healthy{border-left-color:#4ade80}.node.degraded{border-left-color:#fbbf24}.node.unhealthy{border-left-color:#fb7185}.name{font-weight:750;font-size:17px}.detail{color:#94a5bb;margin-top:7px;font-size:13px}.relations{margin-top:28px;background:#111a27;border:1px solid #253247;border-radius:12px;padding:18px}.edge{display:inline-block;background:#1b2a3d;padding:7px 10px;border-radius:20px;margin:4px;color:#bad2ea}a{color:#65d6ad}.legend span{margin-left:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
</style></head><body><header><div><h1>Mapa de serviços</h1><small>AI RAG Harness</small></div><div><a id="chat" href="#">Chat</a> · <a id="access" href="#">Acessos</a> · <a id="grafana" href="#">Grafana</a> · <a id="rabbit" href="#">RabbitMQ</a></div></header><div class="wrap"><div id="summary" class="summary">Consultando serviços…</div><div id="grid" class="grid"></div><div class="relations"><h2>Relações</h2><div id="edges"></div></div></div><script>
const host=location.hostname;document.querySelector('#chat').href=`http://${host}:8080/chat`;document.querySelector('#access').href=`http://${host}:8083`;document.querySelector('#grafana').href=`http://${host}:3000`;document.querySelector('#rabbit').href=`http://${host}:15672`;
async function refresh(){try{const r=await fetch('/status-api/services');const data=await r.json();const ok=data.services.filter(x=>x.status==='healthy').length;document.querySelector('#summary').textContent=`${ok}/${data.services.length} serviços saudáveis · atualizado ${new Date().toLocaleTimeString('pt-BR')}`;document.querySelector('#grid').innerHTML=data.services.map(x=>`<div class="node ${x.status}"><div class="name">${x.name}</div><div class="detail">${x.status} · ${x.latency_ms} ms<br>${x.detail}</div></div>`).join('');document.querySelector('#edges').innerHTML=data.relations.map(x=>`<span class="edge">${x[0]} → ${x[1]}</span>`).join('')}catch(e){document.querySelector('#summary').textContent='Falha ao consultar a API: '+e.message}}refresh();setInterval(refresh,10000);
</script></body></html>
